        \ kwh = n('sensor.monthly_net_consumption_holunderweg_3');\n  const ct = cost && kwh ? cost / kwh : 0.35;\n  const year = base === null ? null : base * 8.76;\n  const f = (v, d) => v === null ?\
        \ '–' : v.toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});\n  const ph = [[\"L1\", \"sensor.tibber_locl_0100240700ff\"], [\"L2\", \"sensor.tibber_locl_0100380700ff\"\
        ], [\"L3\", \"sensor.tibber_locl_01004c0700ff\"]].map(([l, id]) => [l, n(id) ?? 0]);\n  const pm = Math.max(...ph.map(p => p[1]), 1);\n  const phases = ph.map(([l, w]) => `<div style=\"display:grid;grid-template-columns:24px\
        \ 1fr 60px;gap:8px;align-items:center;margin:4px 0\">\n      <b style=\"font-size:12px\">${l}</b><div style=\"height:8px;border-radius:4px;background:rgba(127,127,127,.12);overflow:hidden\">\n \
        \     <div style=\"height:100%;width:${w / pm * 100}%;background:#64748b\"></div></div><span style=\"text-align:right;font-size:12px\">${Math.round(w)} W</span></div>`).join('');\n  return `<div\
        \ style=\"display:flex;gap:14px;align-items:center\">\n      <div style=\"width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:#64748b26\"\
        >\n        <ha-icon icon=\"mdi:sleep\" style=\"--mdc-icon-size:26px;color:#64748b\"></ha-icon></div>\n      <div style=\"flex:1\"><div style=\"font-size:12px;color:var(--secondary-text-color);text-transform:uppercase;letter-spacing:.06em\"\
        >Grundlast</div>\n        <div style=\"font-size:32px;font-weight:300;line-height:1.1\">${f(base, 0)} W</div></div>\n      <div style=\"text-align:right\"><div style=\"font-size:18px;font-weight:600\"\
        >${f(year, 0)} kWh</div>\n        <div style=\"font-size:12px;color:var(--secondary-text-color)\">≈ ${f(year * ct, 0)} € im Jahr</div></div></div>\n    <div style=\"font-size:13px;line-height:1.4;margin-top:10px\"\
        >So viel läuft immer – auch nachts, wenn niemand etwas tut (unterste 3 % der letzten 7 Tage).\n      Typisch: Router, Kühlschrank, Kameras und Rekorder, Heizungspumpe, Geräte im Standby. Jede neue\
        \ Mess-Steckdose an einem Dauerläufer macht diesen Block kleiner.</div>\n    <div style=\"font-size:11px;color:var(--secondary-text-color);margin-top:4px\">Rechenpreis Ø ${f(ct * 100, 1)} ct/kWh\
        \ (Tibber diesen Monat)</div>\n    <div style=\"font-size:12px;color:var(--secondary-text-color);margin:12px 0 4px\">Last je Phase jetzt – hilft beim Suchen großer Dauerverbraucher</div>${phases}`;\n\
        ]]]"
