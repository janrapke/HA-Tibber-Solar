        >davon erfasst<br><b style=\"font-size:18px;color:var(--primary-text-color)\">${Math.round(measured / Math.max(total, 1) * 100)} %</b></div></div>\n    <div style=\"display:flex;height:18px;border-radius:9px;overflow:hidden;margin:14px\
        \ 0 10px;background:rgba(127,127,127,.12)\">${bar}</div>\n    <div>${legend}</div>\n    <div style=\"font-size:12px;color:var(--secondary-text-color);margin:12px 0 2px\">Was gerade Strom zieht</div>\n\
        \    ${rows || '<div style=\"font-size:13px;padding:6px 0\">Kein erfasstes Gerät über 1 W.</div>'}\n    <div style=\"font-size:11px;color:var(--secondary-text-color);margin-top:8px\">${DEV.length}\
        \ Messstellen · ${offline} gerade offline · Rest = Grundlast und nicht erfasste Geräte</div>`;\n]]]"
