        \  const devs = DEV.map(d => ({...d, w: n(d.p), off: ['unavailable', 'unknown', undefined].includes(states[d.p]?.state)}));\n  const byCat = {};\n  devs.forEach(d => { if (d.w > 0) byCat[d.c] =\
