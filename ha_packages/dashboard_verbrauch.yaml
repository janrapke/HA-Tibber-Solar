        \  const groups = {};\n  devs.forEach(d => { const k = d.g || d.n; (groups[k] = groups[k] || {n: k, c: d.c, g: !!d.g, w: 0, items: []}); groups[k].items.push(d); groups[k].w += Math.max(0, d.w ||\
        \ 0); });\n  const row = (name, w, c, icon, small) => `<div style=\"display:flex;align-items:center;gap:10px;padding:${small ? '4px 0 4px 40px' : '6px 0'}\">\n      ${small ? '' : `<div style=\"\
