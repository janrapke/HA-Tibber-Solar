    show_icon: false
    show_state: false
    triggers_update: all
    styles: &id001
      card:
      - padding: 16px
      - border-radius: 18px
      grid:
      - grid-template-areas: '"c"'
      - grid-template-columns: 1fr
      custom_fields:
        c:
        - white-space: normal
        - text-align: left
        - width: 100%
    type: custom:button-card
    entity: sensor.calculated_house_consumption
    grid_options:
      columns: full
    tap_action:
      action: more-info
    custom_fields:
      c: "[[[\n  const n = (id) => { const x = parseFloat(states[id]?.state); return isNaN(x) ? null : x; };\n  const W = (v) => v === null ? '–' : Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('de-DE',\
        \ {maximumFractionDigits: 2}) + ' kW' : Math.round(v) + ' W';\n  const DEV = [{\"n\": \"Tesla Wallbox\", \"c\": \"auto\", \"p\": \"sensor.tesla_wall_connector_gesamtleistung\"}, {\"n\": \"Klima\
        \ Wohnzimmer\", \"c\": \"klima\", \"p\": \"sensor.klima_wohnzimmer_klima_leistung\"}, {\"n\": \"Ölheizung Brenner (≈300 W)\", \"c\": \"heizung\", \"p\": \"sensor.olbrenner_leistung\"}, {\"n\": \"\
        Spülmaschine\", \"c\": \"spuel\", \"p\": \"sensor.tasmota_energy_power\"}, {\"n\": \"Waschmaschine\", \"c\": \"wasch\", \"p\": \"sensor.waschmaschiene_energy_power\"}, {\"n\": \"Licht außen 1\"\
        , \"c\": \"licht\", \"p\": \"sensor.shellydimmer2_08f9e04436dc_power\"}, {\"n\": \"Licht außen 2\", \"c\": \"licht\", \"p\": \"sensor.shellydimmer2_4cebd6edf59d_power\"}, {\"n\": \"Licht Wohnzimmer\"\
        , \"c\": \"licht\", \"p\": \"sensor.licht_wohnzimmer_leistung\"}, {\"n\": \"Licht Bücherregal\", \"c\": \"licht\", \"p\": \"sensor.antela_smart_steckdose_leistung\"}, {\"n\": \"Fernseher Wohnzimmer\"\
        , \"c\": \"tv\", \"p\": \"sensor.kinderzimmer_hochbett_licht_leistung\"}, {\"n\": \"Licht Keller Lasercutter\", \"c\": \"licht\", \"p\": \"sensor.licht_keller_lasercutter_leistung\"}, {\"n\": \"\
        Licht LED Keller (?)\", \"c\": \"licht\", \"p\": \"sensor.licht_schrank_esszimmer_leistung\"}, {\"n\": \"Fernseher Keller (≈120 W)\", \"c\": \"tv\", \"p\": \"sensor.fernseher_keller_leistung\"},\
        \ {\"n\": \"Surface (geschätzt)\", \"c\": \"computer\", \"p\": \"sensor.surface_netzbezug\"}, {\"n\": \"Akku laden (Netz)\", \"c\": \"akku\", \"p\": \"sensor.shellyplus1pm_e86beaeae1a0_switch_0_power\"\
        }, {\"n\": \"Hydrotower Erdbeere (?)\", \"c\": \"pool\", \"p\": \"sensor.pool_warmepumpe_leistung\"}, {\"n\": \"Hydrotower Salat (?)\", \"c\": \"pool\", \"p\": \"sensor.poolpumpe_leistung\"}, {\"\
        n\": \"Pool-Pumpe (?)\", \"c\": \"pool\", \"p\": \"sensor.steckdose_pool_pumpe_leistung\"}, {\"n\": \"Pool-Pumpe Dach (?)\", \"c\": \"pool\", \"p\": \"sensor.steckdose_pool_pumpe_dach_leistung\"\
        }, {\"n\": \"Pool außen (?)\", \"c\": \"pool\", \"p\": \"sensor.antela_smart_plug_leistung\"}, {\"n\": \"Hydo Paprika (?)\", \"c\": \"klaeren\", \"p\": \"sensor.tasmota_energy_power_2\"}, {\"n\"\
        : \"Monitor Kamera Keller (?)\", \"c\": \"klaeren\", \"p\": \"sensor.wlan_steckdose_2_leistung\"}], CAT = {\"auto\": {\"l\": \"Auto\", \"col\": \"#8b5cf6\", \"i\": \"mdi:car-electric\"}, \"klima\"\
        : {\"l\": \"Klima\", \"col\": \"#0ea5e9\", \"i\": \"mdi:air-conditioner\"}, \"heizung\": {\"l\": \"Heizung\", \"col\": \"#ef4444\", \"i\": \"mdi:fire\"}, \"spuel\": {\"l\": \"Spülmaschine\", \"\
        col\": \"#3b82f6\", \"i\": \"mdi:dishwasher\"}, \"wasch\": {\"l\": \"Waschmaschine\", \"col\": \"#06b6d4\", \"i\": \"mdi:washing-machine\"}, \"licht\": {\"l\": \"Licht\", \"col\": \"#f59e0b\", \"\
        i\": \"mdi:lightbulb-on-outline\"}, \"tv\": {\"l\": \"TV & Unterhaltung\", \"col\": \"#ec4899\", \"i\": \"mdi:television\"}, \"computer\": {\"l\": \"Computer\", \"col\": \"#6366f1\", \"i\": \"mdi:laptop\"\
        }, \"akku\": {\"l\": \"Akku laden\", \"col\": \"#10b981\", \"i\": \"mdi:battery-charging\"}, \"pool\": {\"l\": \"Pool & Hydro\", \"col\": \"#14b8a6\", \"i\": \"mdi:pool\"}, \"klaeren\": {\"l\":\
        \ \"Zu klären\", \"col\": \"#a855f7\", \"i\": \"mdi:help-circle-outline\"}};\n\n  const total = Math.max(0, (n('sensor.calculated_house_consumption') ?? 0) + [\"sensor.tesla_wall_connector_gesamtleistung\"\
        , \"sensor.klima_wohnzimmer_klima_leistung\"].reduce((a, id) => a + Math.max(0, n(id) ?? 0), 0));\n  const base = n('sensor.grundlast');\n  const devs = DEV.map(d => ({...d, w: n(d.p), off: ['unavailable',\
        \ 'unknown', undefined].includes(states[d.p]?.state)}));\n  const byCat = {};\n  devs.forEach(d => { if (d.w > 0) byCat[d.c] = (byCat[d.c] || 0) + d.w; });\n  const measured = Object.values(byCat).reduce((a,\
        \ b) => a + b, 0);\n  const rest = Math.max(0, total - measured);\n  const baseShare = base === null ? 0 : Math.min(rest, base);\n  const segs = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c,\
        \ w]) => [CAT[c].l, w, CAT[c].col])\n    .concat([['Grundlast', baseShare, '#64748b'], ['Nicht zugeordnet', rest - baseShare, 'rgba(127,127,127,.35)']]);\n  const sum = Math.max(total, measured,\
        \ 1);\n  const bar = segs.filter(s => s[1] > 0).map(s => `<div title=\"${s[0]}: ${W(s[1])}\" style=\"width:${s[1] / sum * 100}%;background:${s[2]}\"></div>`).join('');\n  const legend = segs.filter(s\
        \ => s[1] > 0.5).map(s => `<span style=\"display:inline-flex;align-items:center;gap:5px;margin:0 10px 4px 0;font-size:12px\">\n      <span style=\"width:10px;height:10px;border-radius:3px;background:${s[2]}\"\
        ></span>${s[0]} <b>${W(s[1])}</b></span>`).join('');\n  const run = devs.filter(d => d.w > 1).sort((a, b) => b.w - a.w);\n  const rows = run.map(d => { const c = CAT[d.c]; return `<div style=\"\
        display:flex;align-items:center;gap:10px;padding:6px 0\">\n      <div style=\"width:30px;height:30px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:${c.col}22\"\
        >\n        <ha-icon icon=\"${c.i}\" style=\"--mdc-icon-size:17px;color:${c.col}\"></ha-icon></div>\n      <div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\"\
        >${d.n}</div>\n        <div style=\"height:4px;border-radius:2px;background:rgba(127,127,127,.12);margin-top:4px;overflow:hidden\">\n          <div style=\"height:100%;width:${Math.min(100, d.w\
        \ / sum * 100)}%;background:${c.col}\"></div></div></div>\n      <div style=\"width:70px;text-align:right;font-size:13px;font-weight:600\">${W(d.w)}</div></div>`; }).join('');\n  const offline =\
        \ devs.filter(d => d.off).length;\n  return `<div style=\"display:flex;justify-content:space-between;align-items:flex-end\">\n      <div><div style=\"font-size:12px;color:var(--secondary-text-color);text-transform:uppercase;letter-spacing:.06em\"\
        >Haus verbraucht gerade</div>\n        <div style=\"font-size:40px;font-weight:300;line-height:1.1\">${W(total)}</div></div>\n      <div style=\"text-align:right;font-size:12px;color:var(--secondary-text-color)\"\
        >davon erfasst<br><b style=\"font-size:18px;color:var(--primary-text-color)\">${Math.round(measured / Math.max(total, 1) * 100)} %</b></div></div>\n    <div style=\"display:flex;height:18px;border-radius:9px;overflow:hidden;margin:14px\
        \ 0 10px;background:rgba(127,127,127,.12)\">${bar}</div>\n    <div>${legend}</div>\n    <div style=\"font-size:12px;color:var(--secondary-text-color);margin:12px 0 2px\">Was gerade Strom zieht</div>\n\
        \    ${rows || '<div style=\"font-size:13px;padding:6px 0\">Kein erfasstes Gerät über 1 W.</div>'}\n    <div style=\"font-size:11px;color:var(--secondary-text-color);margin-top:8px\">${DEV.length}\
        \ Messstellen · ${offline} gerade offline · Rest = Grundlast und nicht erfasste Geräte</div>`;\n]]]"
  - type: custom:apexcharts-card
    grid_options:
      columns: full
    graph_span: 24h
    stacked: true
    header:
      show: true
      title: Erfasste Geräte 24 h (gestapelt)
      show_states: false
    apex_config:
      chart:
        height: 240
        toolbar:
          show: false
      grid:
        strokeDashArray: 4
      legend:
        show: false
      stroke:
        width: 1
      yaxis:
        decimalsInFloat: 0
