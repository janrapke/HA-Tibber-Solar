# GENERIERT von scripts/build_dashboard_verbrauch.py – dort Geräte ergänzen, nicht hier.
title: Verbrauch
path: verbrauch
icon: mdi:chart-donut
type: sections
max_columns: 3
dense_section_placement: true
sections:
- type: grid
  cards:
  - type: heading
    heading: Jetzt
    icon: mdi:flash
