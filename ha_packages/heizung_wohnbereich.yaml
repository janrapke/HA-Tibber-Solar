# ============================================================
# Package: Heizung Wohnbereich – wann der Wohnbereich warm sein soll
# ============================================================
#
# Einbinden in configuration.yaml:
#   homeassistant:
#     packages:
#       heizung_wohnbereich: !include ha_packages/heizung_wohnbereich.yaml
#
# Nachtphase 23:40–07:00 und wenn niemand zuhause ist zählt nur der Fernseher,
# der Bewegungsmelder (input_boolean.anwesenheit_wohnbereich) nicht.
# Genutzt von den Automationen Heizung_Wohnzimmer / Heizung Esszimmer
# (Blueprint ECO Heating Ultimate) und von der Klima-Steuerung der Integration.
#
# Küche: Heizkörper 03.11.–06.11.2026 dauerhaft aus (sitzt unter der Arbeitsplatte und heizt vor
# allem die Schubladen). Ab 06.11.2026 wieder an (BT Küche, Automation "Heizung Küche"), weil der
# Wohnbereich mit Heizkurve 1,1 / Tag 21 °C bei Anwesenheit keine 21 °C mehr schaffte:
#   Do 05.11. 14:45–22:00 Soll 21, Raum 19,1–19,8 °C (nur Heizkörper, 4–10 °C draußen);
#   Fr 06.11. erst mit Klima-Hilfe 15–17 Uhr auf 21 °C, danach wieder auf 20,2 °C gefallen.
# Nächster Schritt, falls es mit Küche nicht reicht: Raumsoll Tag am Kessel 21 -> 22 °C (vom Besitzer).
#
# Kessel-Regler (Intercal, witterungsgeführt, ohne Raumfühler) – Änderungen für den Vorher-Nachher-Vergleich:
#   bis 04.11.2026: Heizkurve 1,20, Raumsoll Tag 23 °C, Nacht 19 °C, Warmwasser 50 °C
#   ab  04.11.2026: Heizkurve 1,10, Raumsoll Tag 21 °C, Nacht 19 °C (Vorlauf ~5–7 K niedriger)
#     Direktkreis (DK) reduziert = ECO (nachts Heizkreis ganz aus, nur Frostschutz; war schon so),
#     Heizsystem-Exponent 1,30 (Heizkörper, unverändert), max. 3 Schaltzeiten pro Tag.
#     DK Zeitprogramm (P = eigenes): nur EIN Fenster je Tag, Mo–Fr 04:00–23:00, Sa–So 06:00–23:30
#     (vorher 05:30–24:00). Jedes Fenster ist Heizbetrieb, ECO greift nur außerhalb: am 04.11. 00:48
#     lief der Kreis wegen lückenloser Fenster nachts weiter, danach "Auto-Eco DK" bestätigt.
#     Warmwasser: Mo–Fr 00–04 40 °C / 04–22 50 °C / 22–24 40 °C, Sa–So 00–06 40 / 06–22 50 / 22–24 40
#     (vorher rund um die Uhr 50 °C -> nächtliche Kurzläufe nur fürs Warmwasser),
#     Legionellenschutz des Reglers montags (eingebaut).
#   Zählerstand Regler 04.11.2026 00:48: 62.260 Brennerstarts, 16.733 Betriebsstunden (Lebensdauer-
#     mittel 16 min je Start; gemessen Ende Okt. nur 3–4 min je Start). Zum Abgleich mit
#     binary_sensor.olheizung_brenner_lauft: Zählerdifferenz nach einigen Tagen gegen erkannte Starts.
#   Warmwasser lädt nach ab 42 °C (Schaltdifferenz 8 K unter 50 °C).
#   Erwartung: weniger Brennerstarts nachts, längere Läufe, Grundlast < 1,2 L/Tag, Bad-Vorheizen
#   ab 04:00 mit warmem Wasser (vorher erst ab ~06:00).
#
# Beobachtung ab 04.11.2026 (Besitzer: "gefühlt sehr kalt"): Wohnzimmer 7–23 Uhr Ø 20,0 °C
#   (28.10.–03.11.: 20,5–21,5 °C). Ab 15 Uhr heizten die BTs 3 h voll, Raum nur 19,7 -> 20,4 °C,
#   Ventilköpfe nur 20–22 °C (Heizkörper lauwarm, Vorlauf nach Heizkurve 1,1 / Tag 21 °C).
#   Strom 43–55 ct, darum keine Klima-Hilfe. Küche lag vorher und nachher ~0,5 K unter Wohnzimmer.
#   Plan des Besitzers: erst beobachten. Liegt das Wohnzimmer bei Anwesenheit (Soll 21 °C) an
#   mehreren Tagen im Schnitt unter 20,5 °C, als ERSTEN Schritt vorschlagen, den Küchen-Heizkörper
#   wieder mitlaufen zu lassen (der Besitzer meint, die Küche bringt mehr); erst danach Raumsoll
#   Tag am Kessel 21 -> 22 °C. Nur vorschlagen, nicht selbst ändern.
#
# Weiterheizen (Wunsch des Besitzers 10.11.2026): input_boolean.heizung_weiterheizen, per Knopf auf
# der Startseite unter den Personen oder per Alexa ("Alexa, schalte Weiterheizen ein").
#   Für "nur kurz weg" (Temperatur halten statt absenken) und zum Vorheizen auf dem Heimweg.
#   An = Wohnbereich (Wohnzimmer, Esszimmer, Küche, Flur folgt) heizt, als wäre jemand im
#   Wohnzimmer – außer in der Nachtphase 23:40–07:00, dort gelten wie sonst die Nachtwerte.
#   Geht von selbst aus: nach 3 h (timer.heizung_weiterheizen) oder 30 min nachdem jemand
#   heimgekommen ist (dann übernimmt die normale Anwesenheit).

input_boolean:
  heizung_weiterheizen:
    name: "Weiterheizen"
    icon: mdi:home-thermometer

timer:
  heizung_weiterheizen:
    name: "Weiterheizen Restzeit"
    duration: "03:00:00"
    icon: mdi:timer-sand

automation:
  - id: heizung_weiterheizen_timer
    alias: "Weiterheizen: Timer starten und stoppen"
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.heizung_weiterheizen
        to: "on"
        id: "an"
      - trigger: state
        entity_id: input_boolean.heizung_weiterheizen
        to: "off"
        id: "aus"
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.heizung_weiterheizen
        id: "abgelaufen"
    actions:
      - choose:
          - conditions: [{condition: trigger, id: "an"}]
            sequence:
              - action: timer.start
                target: {entity_id: timer.heizung_weiterheizen}
          - conditions: [{condition: trigger, id: "aus"}]
            sequence:
              - action: timer.cancel
                target: {entity_id: timer.heizung_weiterheizen}
          - conditions: [{condition: trigger, id: "abgelaufen"}]
            sequence:
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.heizung_weiterheizen}

  - id: heizung_weiterheizen_heimgekommen
    alias: "Weiterheizen: aus, wenn jemand heimgekommen ist"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.anwesnedheit_irgendjemand
        from: "off"
        to: "on"
        for: "00:30:00"
    conditions:
      - condition: state
        entity_id: input_boolean.heizung_weiterheizen
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.heizung_weiterheizen}

  # Flur läuft mit dem Wohnzimmer mit, immer 1 K darunter (Wunsch des Besitzers 06.11.2026).
  # Wird von der Klima-Steuerung der Integration mit den anderen Heiz-Automationen pausiert.
  - id: heizung_flur_folgt_wohnzimmer
    alias: "Heizung Flur folgt Wohnzimmer (-1 °C)"
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: climate.bt_wohnzimmer_bt_wohnzimmer
        attribute: temperature
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
    variables:
      ziel: "{{ (state_attr('climate.bt_wohnzimmer_bt_wohnzimmer', 'temperature') | float(0)) - 1 }}"
    conditions:
      - condition: state
        entity_id: input_boolean.heizung_manuell
        state: "off"
      - condition: template
        value_template: >
          {{ ziel >= 5 and state_attr('climate.bt_flur_bt_flur', 'temperature') | float(0) != ziel }}
    actions:
      - action: climate.set_temperature
        target:
          entity_id: climate.bt_flur_bt_flur
        data:
          temperature: "{{ ziel }}"

template:
  - binary_sensor:
      - name: "Heizung Wohnbereich aktiv"
        unique_id: heizung_wohnbereich_aktiv
        icon: mdi:sofa
        state: >
          {% set tv = is_state('media_player.lg_webos_tv_up75009lf', 'on') %}
          {% set t = now().strftime('%H:%M') %}
          {% set night = t >= '23:40' or t < '07:00' %}
          {% set weiter = is_state('input_boolean.heizung_weiterheizen', 'on') %}
          {{ tv or (weiter and not night)
             or (is_state('input_boolean.anwesnedheit_irgendjemand', 'on') and not night
                 and is_state('input_boolean.anwesenheit_wohnbereich', 'on')) }}
        attributes:
          fernseher: "{{ is_state('media_player.lg_webos_tv_up75009lf', 'on') }}"
          weiterheizen: "{{ is_state('input_boolean.heizung_weiterheizen', 'on') }}"
          nachtphase: "{% set t = now().strftime('%H:%M') %}{{ t >= '23:40' or t < '07:00' }}"
      - name: "Heizung jemand da"
        unique_id: heizung_jemand_da
        icon: mdi:home-account
        # niemand zuhause, aber der Fernseher läuft (z. B. Gäste) oder "Weiterheizen" ist an -> trotzdem heizen
        state: >
          {{ is_state('input_boolean.anwesnedheit_irgendjemand', 'on')
             or is_state('media_player.lg_webos_tv_up75009lf', 'on')
             or is_state('input_boolean.heizung_weiterheizen', 'on') }}
