# GENERIERT von scripts/build_dashboard_rooms.py (Raumliste). Vorlage „raum“: dashboard_button_templates.yaml
- title: Badezimmer
  path: raum-bad
  icon: mdi:shower
  subview: true
  back_path: /dashboard-home/0
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Badezimmer
      icon: mdi:shower
    - type: custom:button-card
      template: raum
      variables:
        name: Badezimmer
        icon: mdi:shower
        temp: sensor.h5179_f06f_temperature
        hum: sensor.h5179_f06f_humidity
        bts:
        - climate.bt_bad
        valves:
        - climate.fritz_smart_thermo_302_1
        k: input_number.heizung_warm_k_badezimmer
        big: true
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      graph_span: 24h
      header:
        show: true
        title: Temperatur 24 h
        show_states: true
        colorize_states: true
      apex_config:
        chart:
          height: 200
          toolbar:
            show: false
        grid:
          strokeDashArray: 4
        legend:
          show: false
      series:
      - entity: sensor.h5179_f06f_temperature
        name: Raum
        color: '#f59e0b'
        type: area
        opacity: 0.15
        stroke_width: 2
        float_precision: 1
        group_by:
          func: avg
          duration: 10min
      - entity: climate.bt_bad
        attribute: temperature
        name: Ziel
        color: '#10b981'
        curve: stepline
        stroke_width: 2
        float_precision: 1
        group_by:
          func: last
          duration: 10min
      - entity: climate.fritz_smart_thermo_302_1
        attribute: current_temperature
        name: Heizkörper
        color: '#ef4444'
        stroke_width: 1
        float_precision: 1
        group_by:
          func: avg
          duration: 10min
      - entity: sensor.openweathermap_temperature
        name: Außen
        color: '#818cf8'
        stroke_width: 1
        float_precision: 1
        group_by:
          func: avg
          duration: 10min
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      graph_span: 24h
      header:
        show: true
        title: Luftfeuchte 24 h
        show_states: true
        colorize_states: true
      apex_config:
        chart:
          height: 160
          toolbar:
            show: false
        grid:
          strokeDashArray: 4
        legend:
          show: false
      series:
      - entity: sensor.h5179_f06f_humidity
        name: Luftfeuchte
        color: '#14b8a6'
        type: area
        opacity: 0.15
        stroke_width: 2
        float_precision: 0
        group_by:
          func: avg
          duration: 10min
      yaxis:
      - min: 20
        max: 80
        decimals: 0
  - type: grid
    cards:
    - type: heading
      heading: Woche
      icon: mdi:calendar-week
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      graph_span: 7d
      header:
        show: true
        title: Temperatur und Luftfeuchte 7 Tage
        show_states: true
        colorize_states: true
      apex_config:
        chart:
          height: 220
          toolbar:
            show: false
        grid:
          strokeDashArray: 4
        legend:
          show: false
      series:
      - entity: sensor.h5179_f06f_temperature
        name: Temperatur
        yaxis_id: t
        color: '#f59e0b'
        stroke_width: 2
        float_precision: 1
        group_by:
          func: avg
          duration: 1h
      - entity: sensor.h5179_f06f_humidity
        name: Luftfeuchte
        yaxis_id: h
        color: '#14b8a6'
        stroke_width: 2
        float_precision: 0
        group_by:
          func: avg
          duration: 1h
      yaxis:
      - id: t
        decimals: 0
      - id: h
        opposite: true
        min: 20
        max: 80
        decimals: 0
    - type: heading
      heading: Thermostat
      icon: mdi:thermostat
    - type: tile
      entity: climate.bt_bad
      name: Thermostat
      icon: mdi:thermostat
      color: deep-orange
      features_position: bottom
      grid_options:
        columns: full
      features:
      - type: target-temperature
      - type: climate-hvac-modes
        hvac_modes:
        - heat
        - 'off'
