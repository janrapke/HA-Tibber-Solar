# ============================================================
# Weitere Karten der Home-Ansicht (Dashboard dashboard-home) im neuen Stil.
# Schlüssel = Karte; das Einspielen ersetzt die alten Karten an ihrer Stelle.
# Energiefluss und „Heute und Monat“ kommen aus dashboard_strom.yaml.
# Benötigt: button-card (HACS).
# ============================================================

personen:
  type: custom:button-card
  entity: person.jan_philip_ropke
  show_name: false
  show_icon: false
  show_state: false
  triggers_update: [person.jan_philip_ropke, person.annika_grolich]
  tap_action: {action: more-info}
  styles:
    card: [{padding: 12px 14px}, {border-radius: 18px}]
    grid: [{grid-template-areas: '"c"'}, {grid-template-columns: 1fr}]
    custom_fields:
      c: [{white-space: normal}, {text-align: left}, {width: 100%}]
  custom_fields:
    c: |
      [[[
        const P = ['person.jan_philip_ropke', 'person.annika_grolich'];
        const ago = (t) => { const m = Math.round((Date.now() - Date.parse(t)) / 60000);
          return m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' Tagen'; };
        const one = (id) => { const s = states[id]; if (!s) return '';
          const home = s.state === 'home', away = s.state === 'not_home';
          const zone = home ? 'Zuhause' : away ? 'Unterwegs' : s.state;
          const col = home ? '#10b981' : '#9ca3af';
          const first = (s.attributes.friendly_name || '').split(' ')[0];
          const pic = s.attributes.entity_picture;
          return `<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
            <div style="position:relative;width:42px;height:42px;flex:none">
              <div style="width:42px;height:42px;border-radius:50%;background:${pic ? `url(${pic}) center/cover` : 'rgba(127,127,127,.2)'};
                   box-shadow:0 0 0 2px var(--card-background-color),0 0 0 4px ${col}"></div>
              <div style="position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:${col};
                   border:2px solid var(--card-background-color);display:flex;align-items:center;justify-content:center">
                <ha-icon icon="${home ? 'mdi:home' : 'mdi:walk'}" style="--mdc-icon-size:10px;color:#fff"></ha-icon></div></div>
            <div style="min-width:0">
              <div style="font-size:14px;font-weight:600">${first}</div>
              <div style="font-size:11px;color:var(--secondary-text-color);white-space:nowrap">${zone} · seit ${ago(s.last_changed)}</div></div></div>`; };
        return `<div style="display:flex;gap:12px">${P.map(one).join('')}</div>`;
      ]]]

geraete:
  type: custom:button-card
  entity: sensor.smart_device_tasmota_energy_power_bester_timer
  show_name: false
  show_icon: false
  show_state: false
  triggers_update:
    - sensor.smart_device_waschmaschiene_energy_power_bester_timer
    - sensor.tasmota_energy_power
    - sensor.waschmaschiene_energy_power
  tap_action: {action: more-info}
  styles:
    card: [{padding: 14px 16px}, {border-radius: 18px}]
    grid: [{grid-template-areas: '"c"'}, {grid-template-columns: 1fr}]
    custom_fields:
      c: [{white-space: normal}, {text-align: left}, {width: 100%}]
  custom_fields:
    c: |
      [[[
        const D = [
          ['Spülmaschine', 'mdi:dishwasher', 'sensor.smart_device_tasmota_energy_power_bester_timer', 'sensor.tasmota_energy_power'],
          ['Waschmaschine', 'mdi:washing-machine', 'sensor.smart_device_waschmaschiene_energy_power_bester_timer', 'sensor.waschmaschiene_energy_power'],
        ];
        const eur = (x) => x === undefined || x === null || isNaN(x) ? '–' : Number(x).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';
        const hm = (t) => t ? new Date(t).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}) : '–';
        const row = ([name, icon, tid, pid]) => {
          const s = states[tid], a = s?.attributes || {};
          const w = parseFloat(states[pid]?.state) || 0;
          const run = w > 10, h = parseInt(s?.state);
          const save = a.ersparnis_eur || 0;
          const col = run ? '#3b82f6' : save >= 0.05 ? '#10b981' : '#9ca3af';
          const title = run ? 'läuft · ' + Math.round(w) + ' W' : isNaN(h) ? 'noch keine Preise' : h === 0 ? 'jetzt starten' : 'Timer ' + h + ' h';
          const hrs = (a.stunden || []).slice(0, 12);
          const mx = Math.max(...hrs.map(x => x.eur), 0.01), mn = Math.min(...hrs.map(x => x.eur), mx);
          const bars = run || !hrs.length ? '' : `<div style="display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:6px">` + hrs.map(x => {
            const best = x.h === a.timer_h;
            const hh = 6 + (x.eur - mn) / Math.max(mx - mn, 0.001) * 20;
            return `<div title="${x.start}: ${eur(x.eur)}" style="flex:1;height:${hh}px;border-radius:3px;background:${best ? '#10b981' : 'rgba(127,127,127,.25)'}"></div>`; }).join('') +
            `</div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--secondary-text-color)"><span>jetzt</span><span>+${hrs.length - 1} h</span></div>`;
          return `<div style="display:flex;gap:12px;align-items:flex-start;padding:8px 0">
            <div style="width:38px;height:38px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:${col}26">
              <ha-icon icon="${icon}" style="--mdc-icon-size:21px;color:${col}"></ha-icon></div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px">
                <div style="font-size:14px;font-weight:600;white-space:nowrap">${name}</div>
                <div style="font-size:13px;font-weight:600;color:${col};white-space:nowrap">${title}</div></div>
              ${run || isNaN(h) ? '' : `<div style="font-size:11px;color:var(--secondary-text-color)">Start ${hm(a.start)} · fertig ${hm(a.ende)} · ${eur(a.kosten_eur)}${save >= 0.01 ? ` <span style="color:#10b981;font-weight:600">−${eur(save)}</span>` : ''}</div>`}
              ${bars}
            </div></div>`; };
        return `<div style="font-size:12px;color:var(--secondary-text-color);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Günstig starten</div>${D.map(row).join('<div style="height:1px;background:var(--divider-color)"></div>')}`;
      ]]]

schloss:
  type: tile
  entity: lock.nuki_reskey_lock
  name: Kellertür
  color: green
  features_position: inline
  features:
    - type: lock-commands

garten:
  type: vertical-stack
  cards:
    - type: grid
      columns: 2
      square: false
      cards:
        - type: tile
          entity: input_boolean.rasen_giessen_schslter
          name: Rasen gießen
          icon: mdi:sprinkler-variant
          color: blue
          vertical: true
          tap_action: {action: toggle}
          state_content: state
        - type: tile
          entity: input_boolean.strahler_einfahrt
          name: Strahler Einfahrt
          icon: mdi:car-light-dimmed
          color: amber
          vertical: true
          tap_action: {action: toggle}
          state_content: state
    - type: tile
      entity: input_number.giessdauer
      name: Gießdauer
      icon: mdi:timer-sand
      color: blue
      features_position: inline
      features:
        - {type: numeric-input, style: slider}

sauger:
  type: tile
  entity: vacuum.roborock
  name: Roborock
  icon: mdi:robot-vacuum
  color: teal
  features_position: bottom
  features:
    - type: vacuum-commands
      commands: [start_pause, stop, return_home, locate]

netz_24h:
  type: custom:apexcharts-card
  graph_span: 24h
  header: {show: true, title: Stromverbrauch 24 h, show_states: true, colorize_states: true}
  apex_config:
    chart: {height: 170, toolbar: {show: false}}
    grid: {strokeDashArray: 4}
    legend: {show: false}
  series:
    - entity: sensor.power_holunderweg_3
      name: Netz
      color: '#ef4444'
      type: area
      opacity: 0.12
      stroke_width: 2
      float_precision: 0
      group_by: {func: avg, duration: 5min}
    - entity: sensor.ballkonkraftwerk_power
      name: Akku
      color: '#10b981'
      stroke_width: 2
      float_precision: 0
      group_by: {func: avg, duration: 5min}
