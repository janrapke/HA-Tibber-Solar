# ============================================================
# Package: Heizung Bad (climate.bt_bad, Fritz-Thermostat mit Govee-Raumsensor)
# ============================================================
#
# Einbinden in configuration.yaml:
#   homeassistant:
#     packages:
#       heizung_bad: !include ha_packages/heizung_bad.yaml
#
# Ersetzt die Blueprint-Automation "Heizung Bad". Sollwert nach Priorität:
#   Fenster offen                          -> 8 °C (aus)
#   Duschen erkannt / Schalter "Dusche"    -> 28 °C = Ventil voll auf, 45 min (Handtuch trocknet),
#                                             endet früher ab 24 °C im Bad
#   niemand zuhause                        -> 19 °C
#   Mo–Fr vorheizen bis 06:00, dann bis 07:00 -> 21 °C (um 6 Uhr warm; nicht bei "Bad Urlaub")
#   16:00–21:00                            -> 21 °C
#   sonst                                  -> 20 °C tagsüber, 19 °C nachts (21:00–06:00)
#
# Vorheizen: Start = 06:00 minus (21 °C - Badtemperatur) / gelernte Aufheizrate + 10 min Puffer,
# frühestens 03:00. Jeder Morgen misst die echte Rate (Start bis 20,8 °C) und mischt sie
# zu 30 % in input_number.bad_aufheizrate.
# Duschen = Luftfeuchte steigt in 15 min um mindestens 8 Prozentpunkte
# (gemessen: 61,9 -> 72,7 % am 28.10. 07:27, 60,1 -> 79,7 % am 29.10. 21:07).

input_number:
  bad_aufheizrate:
    name: "Bad Aufheizrate (gelernt)"
    min: 0.3
    max: 6
    step: 0.01
    unit_of_measurement: "K/h"
    icon: mdi:chart-line  # start value 1.0 K/h set once by hand, then learned
  bad_vorheizen_start_temp:
    name: "Bad Vorheizen Starttemperatur"
    min: 5
    max: 30
    step: 0.1
    unit_of_measurement: "°C"
    mode: box

input_boolean:
  bad_vorheizen:
    name: "Bad Vorheizen aktiv"
    icon: mdi:radiator
  bad_urlaub:
    name: "Bad Urlaub"
    icon: mdi:palm-tree

input_datetime:
  bad_vorheizen_start:
    name: "Bad Vorheizen Start"
    has_date: true
    has_time: true
  bad_warm_um:
    name: "Bad 21 °C erreicht um"
    has_date: true
    has_time: true

sensor:
  - platform: statistics
    name: "Bad Luftfeuchte Minimum 15 min"
    unique_id: bad_luftfeuchte_min_15min
    entity_id: sensor.h5179_f06f_humidity
    state_characteristic: value_min
    max_age:
      minutes: 15
    sampling_size: 200
    # the Govee only reports changes: without this the minimum turns unknown after 15 quiet
    # minutes and the first rising sample would be its own minimum (30.10.2026)
    keep_last_sample: true

timer:
  bad_dusch_boost:
    name: "Bad Dusch-Boost"
    duration: "00:45:00"
    icon: mdi:shower-head

template:
  - binary_sensor:
      - name: "Bad Duschen erkannt"
        unique_id: bad_duschen_erkannt
        icon: mdi:shower
        state: >
          {% set h = states('sensor.h5179_f06f_humidity') %}
          {% set lo = states('sensor.bad_luftfeuchte_minimum_15_min') %}
          {# no minimum yet (restart/reload): very humid air alone counts as showering #}
          {{ h | is_number and ((lo | is_number and h | float - lo | float >= 8)
                                or (not lo | is_number and h | float >= 75)) }}
  - sensor:
      - name: "Bad Vorheizen ab"
        unique_id: bad_vorheizen_ab
        device_class: timestamp
        icon: mdi:clock-start
        state: >
          {% set rate = states('input_number.bad_aufheizrate') | float(1.0) %}
          {% set room = states('sensor.h5179_f06f_temperature') | float(19) %}
          {% set minutes = ([0, (21 - room)] | max) / ([rate, 0.3] | max) * 60 + 10 %}
          {% set minutes = ([[minutes, 15] | max, 180] | min) %}
          {% set six = today_at('06:00') if now() < today_at('06:00') else today_at('06:00') + timedelta(days=1) %}
          {{ (six - timedelta(minutes=minutes | int)).isoformat() }}
      - name: "Bad Solltemperatur"
        unique_id: bad_solltemperatur
        unit_of_measurement: "°C"
        icon: mdi:thermometer-auto
        state: >
          {% set t = now().strftime('%H:%M') %}
          {% if is_state('binary_sensor.fenster_bad_tur', 'on') %}8
          {% elif is_state('timer.bad_dusch_boost', 'active') %}28
          {% elif is_state('input_boolean.anwesnedheit_irgendjemand', 'off') %}19
          {% elif is_state('input_boolean.bad_vorheizen', 'on') %}21
          {% elif '16:00' <= t < '21:00' %}21
          {% elif '06:00' <= t < '21:00' %}20
          {% else %}19{% endif %}
        attributes:
          grund: >
            {% set t = now().strftime('%H:%M') %}
            {% if is_state('binary_sensor.fenster_bad_tur', 'on') %}Fenster offen
            {% elif is_state('timer.bad_dusch_boost', 'active') %}Dusch-Boost
            {% elif is_state('input_boolean.anwesnedheit_irgendjemand', 'off') %}niemand zuhause
            {% elif is_state('input_boolean.bad_vorheizen', 'on') %}Morgen (Mo–Fr, warm ab 6 Uhr)
            {% elif '16:00' <= t < '21:00' %}Abend
            {% elif '06:00' <= t < '21:00' %}Tag
            {% else %}Nacht{% endif %}

automation:
  - id: heizung_bad_package
    alias: "Heizung Bad (Zeitplan + Dusch-Boost)"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.bad_solltemperatur
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >
          {{ states('sensor.bad_solltemperatur') | is_number and
             state_attr('climate.bt_bad', 'temperature') | float(0) != states('sensor.bad_solltemperatur') | float }}
    actions:
      - action: climate.set_temperature
        target:
          entity_id: climate.bt_bad
        data:
          hvac_mode: heat
          temperature: "{{ states('sensor.bad_solltemperatur') | float }}"

  - id: heizung_bad_vorheizen_start
    alias: "Bad Vorheizen starten (Mo–Fr)"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: time
        after: "03:00:00"
        before: "06:00:00"
        weekday: [mon, tue, wed, thu, fri]
      - condition: state
        entity_id: input_boolean.bad_vorheizen
        state: "off"
      - condition: state  # vacation: no morning preheat while it is on
        entity_id: input_boolean.bad_urlaub
        state: "off"
      - condition: state
        entity_id: input_boolean.anwesnedheit_irgendjemand
        state: "on"
      - condition: template
        value_template: "{{ now() >= states('sensor.bad_vorheizen_ab') | as_datetime }}"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bad_vorheizen
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bad_vorheizen_start
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.bad_vorheizen_start_temp
        data:
          value: "{{ states('sensor.h5179_f06f_temperature') | float(19) }}"

  - id: heizung_bad_vorheizen_lernen
    alias: "Bad Aufheizrate lernen"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.h5179_f06f_temperature
        above: 20.79
    conditions:
      - condition: state
        entity_id: input_boolean.bad_vorheizen
        state: "on"
      - condition: template  # once per morning
        value_template: >
          {{ states('input_datetime.bad_warm_um') in ['unknown', ''] or
             (states('input_datetime.bad_warm_um') | as_datetime | as_local).date() != now().date() }}
    actions:
      - variables:
          hours: "{{ (now() - (states('input_datetime.bad_vorheizen_start') | as_datetime | as_local)).total_seconds() / 3600 }}"
          rise: "{{ 20.8 - states('input_number.bad_vorheizen_start_temp') | float(20.8) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bad_warm_um
        data:
          timestamp: "{{ now().timestamp() }}"
      - if:  # only a real heat-up says something about the rate
          - condition: template
            value_template: "{{ rise >= 0.5 and hours >= 0.1 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.bad_aufheizrate
            data:
              value: >
                {% set old = states('input_number.bad_aufheizrate') | float(1.0) %}
                {{ ([[0.7 * old + 0.3 * rise / hours, 0.3] | max, 6] | min) | round(2) }}

  - id: heizung_bad_vorheizen_ende
    alias: "Bad Vorheizen beenden"
    triggers:
      - trigger: time
        at: "07:00:00"
      - trigger: state
        entity_id: input_boolean.anwesnedheit_irgendjemand
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.bad_vorheizen
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bad_vorheizen

  - id: heizung_bad_dusch_boost
    alias: "Bad Dusch-Boost starten"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.bad_duschen_erkannt
        to: "on"
      - trigger: state
        entity_id: input_boolean.dusche
        to: "on"
    actions:
      - action: timer.start
        target:
          entity_id: timer.bad_dusch_boost

  - id: heizung_bad_dusch_boost_ende
    alias: "Bad Dusch-Boost beenden ab 24 °C"
    triggers:
      - trigger: numeric_state
        entity_id: sensor.h5179_f06f_temperature
        above: 24
    conditions:
      - condition: state
        entity_id: timer.bad_dusch_boost
        state: active
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.bad_dusch_boost
