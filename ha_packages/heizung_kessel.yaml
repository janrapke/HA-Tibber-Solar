# ============================================================
# Package: Heizung Kessel – Kessel-Soll über das ESP an der Theta (Boost)
# ============================================================
#
# Einbinden in configuration.yaml:
#   homeassistant:
#     packages:
#       heizung_kessel: !include ha_packages/heizung_kessel.yaml
#
# Technik (11.11.2026): ESP "Heizung Theta" (esphome/theta-heizung.yaml) emuliert an Klemme 30 den
# Außenfühler 2 (DK 10 = 2). number.heizung_theta_kessel_soll_ziel = 0 -> das ESP reicht die echte
# Außentemperatur durch, die Theta regelt wie immer. Ziel > 0 -> das ESP regelt die Emulation, bis das
# Kessel-Soll der Theta (sensor.heizung_theta_kessel_soll) dem Ziel entspricht. Ohne HA löscht das ESP
# das Ziel nach 10 min selbst; nach einem Neustart steht es auf 0.
# Test 11.11.2026: Soll 65 °C stabil ±0,2 K, Brennerläufe 5–7 min statt 2–3 min, Kessel 58–77 °C
# (Schaltdifferenz WEZ 08 = 12 K). Höchstes erreichbares Soll mit Heizkurve 1,10: ~65 °C.
#
# Boost (Absprache mit dem Besitzer 12.11.2026):
#   Start: der Fernseher läuft (Präsenzmelder allein zählt nicht), Wohnzimmer mindestens 1,5 K unter dem
#     Soll von BT Wohnzimmer, die Theta ist in ihrer Heizzeit (Kessel-Soll > 0 ohne Ziel; nachts ECO = Soll 0)
#     und die Klima heizt weder jetzt noch in den nächsten 15 min (sensor.klima_wohnzimmer_entscheidung,
#     Attribute klima_heizt / klima_heizt_in_15_min) – dann heizt die Klima den Raum schneller auf.
#     Gilt jederzeit in der Heizzeit, also auch morgens nach dem Nachtbetrieb.
#   Ende: Wohnzimmer erreicht Soll - 0,5 K, oder der Fernseher ist 30 min am Stück aus (kurz raus
#     beendet nichts), oder die Klima übernimmt das Heizen, oder nach 2 h, oder um 23:00.
#   Bad-Vorheizen (heizung_bad.yaml) nutzt dieselbe Block-Logik, solange es läuft und
#     input_boolean.kessel_boost_bad an ist; die Lernautomatik passt den Startzeitpunkt selbst an.
#   Dusch-Boost ("Alexa, ich will duschen", timer.bad_dusch_boost) ebenso, mit demselben Schalter (13.11.2026).
#
# Block statt Dauer-Boost (Wunsch des Besitzers 12.11.2026, nach 1,41 L statt ~0,5–1 L am Morgen: 63 °C
#   Dauer-Soll beim Bad-Vorheizen hielt den Kessel bei 63–81 °C, nur der kleine Bad-Heizkörper nahm ab):
#   input_select.kessel_block_phase
#   - "aufheizen": Vorgabe = Ausschalttemperatur - 6 K (WEZ 08 = 12 K Schaltdifferenz, die Theta schaltet
#     bei Soll + 6 K ab). Ein langer Lauf bis zur Ausschalttemperatur; der Kessel läuft danach ~5 K nach.
#   - Brenner geht aus -> "abkuehlen": Vorgabe 0, die Theta regelt normal, der Kessel kühlt wie sonst ab.
#   - Die Theta schaltet von selbst wieder ein -> "aufheizen": Vorgabe wieder hoch, der Lauf geht bis zur
#     Ausschalttemperatur weiter. Bis der Raum warm ist.
#   Ausschalttemperatur Wohnbereich 60 °C (input_number.kessel_boost_temperatur), Bad 55 °C
#     (input_number.kessel_bad_ausschalttemperatur, mit Nachlauf ~60 °C).
#
# Außentemperatur (12.11.2026): der Außenfühler der Theta misst ~4 K zu warm (7 °C bei 3 °C laut
#   Wetterdienst und Tesla). HA schickt dem ESP jede Minute sensor.openweathermap_temperature
#   (number.heizung_theta_aussentemperatur_referenz); das ESP reicht ihn statt des Fühlers durch und nimmt
#   nach 30 min ohne Wert wieder den Fühler. Erwartung: Soll ~46–47 statt 44 °C bei 3 °C draußen.
#   Einstellungen ohne "initial": HA behält nach einem Neustart den zuletzt eingestellten Wert.
#   Kein Alexa-Schalter: dafür gibt es die Klimaanlage ("mir ist kalt").

input_boolean:
  kessel_boost:
    name: "Kessel-Boost"
    icon: mdi:fire-alert
  kessel_boost_bad:
    name: "Kessel-Boost beim Bad-Vorheizen"
    icon: mdi:shower-head

input_number:
  kessel_boost_temperatur:
    name: "Kessel-Boost Ausschalttemperatur"
    min: 50
    max: 70
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high
  kessel_bad_ausschalttemperatur:
    name: "Kessel Bad-Vorheizen Ausschalttemperatur"
    min: 45
    max: 70
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:shower-head
  kessel_boost_ende_abstand:
    name: "Kessel-Boost Ende unter Soll"
    min: 0
    max: 1.5
    step: 0.1
    unit_of_measurement: "K"
    icon: mdi:thermometer-minus

input_select:
  kessel_block_phase:
    name: "Kessel Block-Phase"
    options: ["aus", "aufheizen", "abkuehlen"]
    icon: mdi:sine-wave

timer:
  kessel_boost:
    name: "Kessel-Boost Restzeit"
    duration: "02:00:00"
    icon: mdi:timer-sand

template:
  - sensor:
      - name: "Kessel-Soll Vorgabe"
        unique_id: kessel_soll_vorgabe
        unit_of_measurement: "°C"
        icon: mdi:target
        # 0 = keine Vorgabe, die Theta regelt selbst
        # Soll = Ausschalttemperatur - 6 K (half of the 12 K switching difference WEZ 08), only while "aufheizen"
        state: >
          {% set boost = is_state('input_boolean.kessel_boost', 'on') %}
          {% set bad = (is_state('input_boolean.bad_vorheizen', 'on') or is_state('timer.bad_dusch_boost', 'active'))
                       and is_state('input_boolean.kessel_boost_bad', 'on') %}
          {% set aus = [states('input_number.kessel_boost_temperatur') | float(65) if boost else 0,
                        states('input_number.kessel_bad_ausschalttemperatur') | float(55) if bad else 0] | max %}
          {{ (aus - 6) if (boost or bad) and is_state('input_select.kessel_block_phase', 'aufheizen') else 0 }}
        attributes:
          grund: >
            {% set ph = 'Aufheizen' if is_state('input_select.kessel_block_phase', 'aufheizen') else 'Abkühlen bis zum nächsten Start' %}
            {% if is_state('input_boolean.kessel_boost', 'on') %}Boost Wohnbereich: {{ ph }}
            {% elif is_state('input_boolean.bad_vorheizen', 'on') and is_state('input_boolean.kessel_boost_bad', 'on') %}Bad vorheizen: {{ ph }}
            {% elif is_state('timer.bad_dusch_boost', 'active') and is_state('input_boolean.kessel_boost_bad', 'on') %}Dusch-Boost: {{ ph }}
            {% else %}Theta regelt selbst{% endif %}

automation:
  # Block-Phasen: aufheizen bis zur Ausschalttemperatur, dann normal abkühlen, beim nächsten Start wieder hoch
  - id: kessel_block_phase
    alias: "Kessel-Block: Phase"
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: [input_boolean.kessel_boost, input_boolean.bad_vorheizen, input_boolean.kessel_boost_bad, timer.bad_dusch_boost]
        id: "block"
      - trigger: state
        entity_id: binary_sensor.heizung_theta_brenner
        from: "on"
        to: "off"
        id: "brenner_aus"
      - trigger: state
        entity_id: binary_sensor.heizung_theta_brenner
        from: "off"
        to: "on"
        id: "brenner_an"
    variables:
      aktiv: >
        {{ is_state('input_boolean.kessel_boost', 'on')
           or ((is_state('input_boolean.bad_vorheizen', 'on') or is_state('timer.bad_dusch_boost', 'active'))
               and is_state('input_boolean.kessel_boost_bad', 'on')) }}
      phase: "{{ states('input_select.kessel_block_phase') }}"
      neu: >
        {% if not aktiv %}aus
        {% elif phase == 'aus' %}aufheizen
        {% elif trigger.id == 'brenner_aus' and phase == 'aufheizen' %}abkuehlen
        {% elif trigger.id == 'brenner_an' and phase == 'abkuehlen' %}aufheizen
        {% else %}{{ phase }}{% endif %}
    conditions:
      - condition: template
        value_template: "{{ neu != phase }}"
    actions:
      - action: input_select.select_option
        target: {entity_id: input_select.kessel_block_phase}
        data:
          option: "{{ neu }}"

  # Außentemperatur vom Wetterdienst ans ESP (der Fühler der Theta misst ~4 K zu warm)
  - id: kessel_aussentemperatur_senden
    alias: "Kessel: Außentemperatur ans ESP"
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: sensor.openweathermap_temperature
      - trigger: state
        entity_id: number.heizung_theta_aussentemperatur_referenz
        from: "unavailable"
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: template
        value_template: >
          {{ has_value('number.heizung_theta_aussentemperatur_referenz')
             and states('sensor.openweathermap_temperature') | is_number
             and -35 < states('sensor.openweathermap_temperature') | float < 40 }}
    actions:
      - action: number.set_value
        target: {entity_id: number.heizung_theta_aussentemperatur_referenz}
        data:
          value: "{{ states('sensor.openweathermap_temperature') | float | round(1) }}"

  - id: kessel_boost_start
    alias: "Kessel-Boost: starten"
    mode: single
    triggers:
      - trigger: state
        entity_id: media_player.lg_webos_tv_up75009lf
        to: "on"
      - trigger: time_pattern
        minutes: "/2"
    conditions:
      - condition: state
        entity_id: input_boolean.kessel_boost
        state: "off"
      - condition: state
        entity_id: media_player.lg_webos_tv_up75009lf
        state: "on"
      - condition: template
        # the AC heats now or in the next 15 min -> it warms the room faster, no oil boost
        value_template: >
          {{ not state_attr('sensor.klima_wohnzimmer_entscheidung', 'klima_heizt')
             and not state_attr('sensor.klima_wohnzimmer_entscheidung', 'klima_heizt_in_15_min') }}
      - condition: template
        value_template: >
          {% set raum = states('sensor.wohnzimmer_temperatur') | float(99) %}
          {% set soll = state_attr('climate.bt_wohnzimmer_bt_wohnzimmer', 'temperature') | float(0) %}
          {{ soll > 0 and raum <= soll - 1.5 }}
      - condition: template
        # heating time of the Theta: without a target its Soll is > 0 (night ECO = 0)
        value_template: >
          {{ states('number.heizung_theta_kessel_soll_ziel') | float(0) == 0
             and states('sensor.heizung_theta_kessel_soll') | float(0) > 0 }}
      - condition: time
        after: "05:00:00"
        before: "23:00:00"
    actions:
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.kessel_boost}

  - id: kessel_boost_ende
    alias: "Kessel-Boost: beenden"
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {% set raum = states('sensor.wohnzimmer_temperatur') | float(0) %}
          {% set soll = state_attr('climate.bt_wohnzimmer_bt_wohnzimmer', 'temperature') | float(0) %}
          {{ raum >= soll - states('input_number.kessel_boost_ende_abstand') | float(0.5) }}
        id: "warm"
      - trigger: state
        entity_id: media_player.lg_webos_tv_up75009lf
        from: "on"
        for: "00:30:00"
        id: "fernseher_aus"
      - trigger: template
        value_template: "{{ state_attr('sensor.klima_wohnzimmer_entscheidung', 'klima_heizt') == true }}"
        id: "klima"
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.kessel_boost
        id: "zeit"
      - trigger: time
        at: "23:00:00"
        id: "nacht"
    conditions:
      - condition: state
        entity_id: input_boolean.kessel_boost
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.kessel_boost}
      - action: logbook.log
        data:
          name: "Kessel-Boost"
          message: "beendet ({{ trigger.id }})"
          entity_id: input_boolean.kessel_boost

  - id: kessel_boost_timer
    alias: "Kessel-Boost: Timer"
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.kessel_boost
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.kessel_boost
            state: "on"
        then:
          - action: timer.start
            target: {entity_id: timer.kessel_boost}
        else:
          - action: timer.cancel
            target: {entity_id: timer.kessel_boost}

  # Vorgabe ans ESP geben: bei jeder Änderung immer (12.11.2026: Boost an und 2 s später aus – der Abgleich
  # sah beim ESP noch die alte 0, schickte nichts, und das ESP blieb auf 63 °C stehen), sobald das ESP wieder
  # erreichbar ist, und jede Minute als Abgleich, falls ein Befehl im schwachen WLAN verloren ging.
  - id: kessel_soll_vorgabe_senden
    alias: "Kessel-Soll Vorgabe ans ESP"
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: sensor.kessel_soll_vorgabe
        id: "aenderung"
      - trigger: state
        entity_id: number.heizung_theta_kessel_soll_ziel
        from: "unavailable"
        id: "wieder_da"
      - trigger: time_pattern
        minutes: "/1"
        id: "abgleich"
      - trigger: homeassistant
        event: start
        id: "start"
    conditions:
      - condition: template
        value_template: >
          {{ has_value('number.heizung_theta_kessel_soll_ziel')
             and (trigger.id in ['aenderung', 'wieder_da', 'start']
                  or states('number.heizung_theta_kessel_soll_ziel') | float(-1) != states('sensor.kessel_soll_vorgabe') | float(0)) }}
    actions:
      - action: number.set_value
        target: {entity_id: number.heizung_theta_kessel_soll_ziel}
        data:
          value: "{{ states('sensor.kessel_soll_vorgabe') | float(0) }}"
