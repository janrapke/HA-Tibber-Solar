# ============================================================
# Package: Heizungsanzeige Startseite – wann ein Heizkörper als "warm" gilt
# ============================================================
#
# Einbinden in configuration.yaml:
#   homeassistant:
#     packages:
#       heizung_anzeige: !include ha_packages/heizung_anzeige.yaml
#
# Die Raumkacheln auf der Startseite zeigen "Heizkörper warm", wenn der Fühler im
# Ventilkopf mindestens diese Schwelle über der Raumtemperatur liegt. Jeder Kopf sitzt
# anders am Heizkörper, darum je Raum ein Wert (Start 1,5 K, Bad 4 K; kein initial, damit
# Änderungen einen Neustart überleben). Der Nacht-Agent prüft und justiert ihn.
# Bad: der Fritz-Kopf liegt auch kalt 1,6–3,3 K über dem Raum, warm 4–5 K (28.–30.10.2026).

input_number:
  heizung_warm_k_badezimmer:
    name: "Heizkörper warm ab (Bad)"
    min: 1
    max: 6
    step: 0.5
    unit_of_measurement: "K"
    icon: mdi:radiator
  heizung_warm_k_flur:
    name: "Heizkörper warm ab (Flur)"
    min: 1
    max: 6
    step: 0.5
    unit_of_measurement: "K"
    icon: mdi:radiator
  heizung_warm_k_wohnzimmer:
    name: "Heizkörper warm ab (Wohnzimmer)"
    min: 1
    max: 6
    step: 0.5
    unit_of_measurement: "K"
    icon: mdi:radiator
  heizung_warm_k_kuche:
    name: "Heizkörper warm ab (Küche)"
    min: 1
    max: 6
    step: 0.5
    unit_of_measurement: "K"
    icon: mdi:radiator
  heizung_warm_k_schlafzimmer:
    name: "Heizkörper warm ab (Schlafzimmer)"
    min: 1
    max: 6
    step: 0.5
    unit_of_measurement: "K"
    icon: mdi:radiator
  heizung_warm_k_gastezimmer:
    name: "Heizkörper warm ab (Gästezimmer)"
    min: 1
    max: 6
    step: 0.5
    unit_of_measurement: "K"
    icon: mdi:radiator
  heizung_warm_k_kinderzimmer:
    name: "Heizkörper warm ab (Kinderzimmer)"
    min: 1
    max: 6
    step: 0.5
    unit_of_measurement: "K"
    icon: mdi:radiator
