<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Smart Battery Optimizer Logo</title>
  <desc>Logo showing a battery with solar rays and a lightning bolt, representing smart energy optimization</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      .bg-main    { fill: #0f1117; }
      .ring-outer { stroke: #1e2640; }
      .ring-inner { stroke: #2a3560; }
      .wordmark   { fill: #e8eaf6; }
      .sub        { fill: #7986cb; }
      .batt-body  { fill: #1a2340; stroke: #3949ab; }
      .batt-pole  { fill: #3949ab; }
      .seg1       { fill: #1565c0; }
      .seg2       { fill: #1976d2; }
      .seg3       { fill: #42a5f5; }
      .bolt       { fill: #ffd54f; }
      .ray        { stroke: #ffb300; }
      .divider    { stroke: #2a3560; }
      .pill       { fill: #1e2a50; }
      .pill-text  { fill: #7986cb; }
    }
    .bg-main    { fill: #f0f4ff; }
    .ring-outer { stroke: #c5cae9; fill: none; }
    .ring-inner { stroke: #9fa8da; fill: none; }
    .wordmark   { fill: #1a237e; }
    .sub        { fill: #3949ab; }
    .batt-body  { fill: #e8eaf6; stroke: #3949ab; }
    .batt-pole  { fill: #3949ab; }
    .seg1       { fill: #1a237e; }
    .seg2       { fill: #1976d2; }
    .seg3       { fill: #3949ab; }
    .bolt       { fill: #f9a825; }
    .ray        { stroke: #f9a825; fill: none; stroke-linecap: round; }
    .divider    { stroke: #c5cae9; }
    .pill       { fill: #e8eaf6; }
    .pill-text  { fill: #3949ab; }
  </style>

  <!-- Background -->
  <rect width="680" height="340" rx="20" class="bg-main"/>

  <!-- Icon area: decorative rings -->
  <circle cx="170" cy="170" r="118" class="ring-outer" stroke-width="1"/>
  <circle cx="170" cy="170" r="90"  class="ring-inner" stroke-width="0.8" stroke-dasharray="4 6"/>

  <!-- Solar rays -->
  <g class="ray" stroke-width="3">
    <line x1="170" y1="36"  x2="170" y2="22"/>
    <line x1="170" y1="304" x2="170" y2="318"/>
    <line x1="36"  y1="170" x2="22"  y2="170"/>
    <line x1="304" y1="170" x2="318" y2="170"/>
    <line x1="76"  y1="76"  x2="66"  y2="66"/>
    <line x1="264" y1="76"  x2="274" y2="66"/>
    <line x1="76"  y1="264" x2="66"  y2="274"/>
    <line x1="264" y1="264" x2="274" y2="274"/>
  </g>

  <!-- Battery shell -->
  <rect x="94" y="116" width="136" height="84" rx="10" class="batt-body" stroke-width="3"/>
  <rect x="230" y="149" width="12"  height="22" rx="4"  class="batt-pole"/>

  <!-- Battery segments -->
  <rect x="102" y="124" width="26" height="68" rx="5" class="seg1"/>
  <rect x="133" y="124" width="26" height="68" rx="5" class="seg2"/>
  <rect x="164" y="124" width="26" height="68" rx="5" class="seg3"/>
  <rect x="195" y="124" width="26" height="68" rx="5" class="batt-body" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Lightning bolt -->
  <polygon points="175,108 155,172 168,172 162,200 185,138 172,138" class="bolt"/>

  <!-- Price sparkline -->
  <polyline points="108,222 120,210 132,218 144,200 156,207 168,195 180,202 192,185 204,190 216,178 228,186" class="ray" stroke-width="2.5"/>

  <!-- Wordmark -->
  <text x="345" y="138" font-family="system-ui,sans-serif" font-size="42" font-weight="700" letter-spacing="-1" class="wordmark">Smart Battery</text>
  <text x="345" y="188" font-family="system-ui,sans-serif" font-size="42" font-weight="700" letter-spacing="-1" class="wordmark">Optimizer</text>

  <!-- Subtitle -->
  <text x="347" y="222" font-family="system-ui,sans-serif" font-size="16" font-weight="400" letter-spacing="0.5" class="sub">for Home Assistant · powered by Tibber</text>

  <!-- Divider -->
  <line x1="345" y1="238" x2="625" y2="238" stroke-width="1" class="divider"/>

  <!-- Feature pills – row 1 -->
  <rect x="345" y="250" width="90"  height="22" rx="11" class="pill"/>
  <text x="390"  y="265" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" class="pill-text">Tibber Preise</text>

  <rect x="443" y="250" width="80"  height="22" rx="11" class="pill"/>
  <text x="483"  y="265" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" class="pill-text">Solarstrom</text>

  <rect x="531" y="250" width="100" height="22" rx="11" class="pill"/>
  <text x="581"  y="265" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" class="pill-text">Lernalgorithmus</text>

  <!-- Feature pills – row 2 -->
  <rect x="345" y="280" width="120" height="22" rx="11" class="pill"/>
  <text x="405"  y="295" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" class="pill-text">Überschuss-Steuerung</text>

  <rect x="473" y="280" width="158" height="22" rx="11" class="pill"/>
  <text x="552"  y="295" font-family="system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" class="pill-text">EcoFlow · Hoymiles · Anker</text>
</svg>
